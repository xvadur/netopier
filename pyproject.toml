[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "netopier-v1"
version = "0.1.0"
description = "Local-first Slovak public-source news intelligence backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.141.1",
  "fastembed==0.8.0",
  "httpx==0.28.1",
  "pgvector==0.4.2",
  "psycopg[binary,pool]==3.2.13",
  "pydantic-settings==2.11.0",
  "PyYAML==6.0.3",
  "structlog==25.4.0",
  "uvicorn[standard]==0.40.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "respx==0.22.0",
  "ruff==0.16.5",
]

[project.scripts]
netopier-v1 = "netopier_v1.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netopier_v1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
