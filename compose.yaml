name: netopier

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  miniflux:
    image: miniflux/miniflux:2.3.3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USERNAME:?set in .env}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:?set in .env}
      POLLING_SCHEDULER: round_robin
      POLLING_FREQUENCY: "5"
      SCHEDULER_ROUND_ROBIN_MIN_INTERVAL: "5"
      SCHEDULER_ROUND_ROBIN_MAX_INTERVAL: "15"
      POLLING_LIMIT_PER_HOST: "2"
      BATCH_SIZE: "100"
      CLEANUP_ARCHIVE_READ_DAYS: "-1"
      CLEANUP_ARCHIVE_UNREAD_DAYS: "-1"
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      NETOPIER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/netopier
      MINIFLUX_BASE_URL: http://miniflux:8080
      HOME: /var/cache/netopier
      HF_HOME: /var/cache/netopier/huggingface
      XDG_CACHE_HOME: /var/cache/netopier
      HF_HUB_DISABLE_XET: "1"
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      - model-cache:/var/cache/netopier/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    profiles: ["continuous"]
    command: ["netopier", "worker", "--forever"]
    depends_on:
      postgres:
        condition: service_healthy
      miniflux:
        condition: service_healthy
    env_file: .env
    environment:
      NETOPIER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/netopier
      MINIFLUX_BASE_URL: http://miniflux:8080
      HOME: /var/cache/netopier
      HF_HOME: /var/cache/netopier/huggingface
      XDG_CACHE_HOME: /var/cache/netopier
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - model-cache:/var/cache/netopier/models
    cpus: "1.0"
    mem_limit: 1g
    restart: unless-stopped

volumes:
  postgres-data:
  model-cache:
